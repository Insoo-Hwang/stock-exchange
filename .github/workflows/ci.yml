name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 우분투 러너에는 Docker가 있어 Testcontainers가 그대로 돈다.
      # 실패 재현 테스트(@Tag("reproduce"))는 build.gradle 설정으로 제외된다.
      - name: Test
        run: ./gradlew test
